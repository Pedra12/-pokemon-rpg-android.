name: Build Guardian Monsters Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do repositório de compilação
        uses: actions/checkout@v4

      - name: Baixar o jogo completo e seus assets
        uses: actions/checkout@v4
        with:
          repository: Pedra12/-pokemon-rpg-android
          ref: main
          path: source
          submodules: recursive

      - name: Inspecionar pacotes gráficos enviados
        run: |
          python3 scripts/inspect_asset_packs.py
          python3 scripts/inspect_asset_pack_contents.py

      - name: Publicar relatório dos assets
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-assets
          path: asset-pack-report.txt
          retention-days: 14

      - name: Extrair código do projeto Android vertical enviado
        run: python3 scripts/extract_map_project_sources.py

      - name: Publicar fontes do projeto Android vertical
        uses: actions/upload-artifact@v4
        with:
          name: fontes-projeto-android-vertical
          path: map-project-source/
          retention-days: 14

      - name: Gerar prévias visuais dos assets
        run: |
          python3 -m pip install --user pillow
          python3 scripts/create_asset_previews.py

      - name: Publicar prévias visuais
        uses: actions/upload-artifact@v4
        with:
          name: previsualizacao-clover-valley
          path: asset-previews/
          retention-days: 14

      - name: Aplicar identidade e localização inicial pt-BR
        working-directory: source
        run: python3 scripts/apply_customizations.py

      - name: Preparar Java para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Instalar plataforma e ferramentas Android
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          yes | sdkmanager --licenses

      - name: Preparar Java para Gradle legado
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.7.1"

      - name: Compilar APK Android
        working-directory: source/GuardianMonsters/GuardianMonsters
        run: gradle --no-daemon :android:assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cronicas-de-arvandor-android-debug
          path: source/GuardianMonsters/GuardianMonsters/android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
