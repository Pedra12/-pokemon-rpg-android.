name: Build Aventura Elemental Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: aventura-elemental-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout do repositório de compilação
        uses: actions/checkout@v4

      - name: Baixar os arquivos enviados pelo usuário
        uses: actions/checkout@v4
        with:
          repository: Pedra12/-pokemon-rpg-android
          ref: main
          path: source

      - name: Extrair o projeto Android vertical
        run: |
          mkdir -p project
          unzip -q source/pokemon-rpg-android-clover-valley-map.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/java/br/com/aventuraelemental/MainActivity.kt
          test -d project/app/src/main/assets/clover_valley

      - name: Aplicar melhorias no RPG vertical
        run: python3 scripts/patch_vertical_game.py

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar caminhos do Android SDK pré-instalado
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses

      - name: Instalar plataforma e ferramentas Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK Debug
        run: |
          gradle --no-daemon -p project :app:assembleDebug
          test -s project/app/build/outputs/apk/debug/app-debug.apk

      - name: Testar instalação e abertura em emulador Android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r project/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.com.aventuraelemental/.MainActivity
            sleep 8
            adb shell pidof br.com.aventuraelemental
            adb shell screencap -p /sdcard/aventura-elemental.png
            adb pull /sdcard/aventura-elemental.png ./aventura-elemental-smoke-test.png

      - name: Publicar captura do teste de abertura
        if: always() && hashFiles('aventura-elemental-smoke-test.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: captura-teste-android
          path: aventura-elemental-smoke-test.png
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK para instalação no Android
        if: always() && hashFiles('project/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aventura-elemental-android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
