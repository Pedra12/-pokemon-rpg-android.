name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Baixar RPGAtlas na versão fixada
        run: |
          git clone https://github.com/DriftwoodGaming/RPGAtlas.git rpgatlas
          cd rpgatlas
          git checkout 632d0b9d5856f42d31de5db383daa5ca2e4c3274

      - name: Compilar a versão web do RPGAtlas
        working-directory: rpgatlas
        run: |
          npm ci
          npm run build
          test -f dist/play.html
          test -f dist/index.html

      - name: Preparar aplicativo Android com Capacitor
        run: |
          mkdir www
          cp -R rpgatlas/dist/. www/
          cp www/play.html www/index.html
          cp rpgatlas/LICENSE www/THIRD-PARTY-LICENSE-RPGATLAS.txt

          cat > package.json <<'EOF'
          {
            "name": "rpg-android",
            "version": "1.0.0",
            "private": true,
            "description": "Aplicativo Android baseado no RPGAtlas",
            "scripts": {
              "build": "echo Web assets preparados"
            }
          }
          EOF

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.pedra12.rpgandroid",
            "appName": "RPG Android",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Gerar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
